<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Kireeti profile banner</title>
  <desc id="desc">An editorial dark banner reading Kireeti, turning messy inputs into trustworthy decisions, with an evidence to system to action diagram.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ECE4D2" stroke-width="1" opacity="0.07" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="380" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#0F0E0C" />
    <rect width="1200" height="380" fill="url(#grid)" />

    <rect x="42" y="38" width="212" height="32" fill="#D8FF3D" />
    <text x="58" y="60" fill="#0F0E0C" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">FIELD NOTES / 001</text>

    <text x="44" y="169" fill="#F4EDDE" font-family="Georgia, Times New Roman, serif" font-size="91" font-weight="700">Kireeti</text>
    <text x="49" y="213" fill="#D8FF3D" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.4">EVIDENCE-DRIVEN BUILDER</text>

    <line x1="48" y1="247" x2="650" y2="247" stroke="#F4EDDE" stroke-width="1" opacity="0.35" />
    <text x="48" y="282" fill="#F4EDDE" font-family="Segoe UI, Arial, sans-serif" font-size="23">Turning messy inputs into</text>
    <text x="48" y="314" fill="#F4EDDE" font-family="Segoe UI, Arial, sans-serif" font-size="23">trustworthy decisions.</text>
    <text x="49" y="347" fill="#A9A294" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="1.4">NTU · SINGAPORE · APPLIED AI / DATA / PRODUCT</text>

    <g transform="translate(735 42)">
      <path d="M32 102 C126 102 116 71 198 71 C282 71 281 149 370 149" fill="none" stroke="#F4EDDE" stroke-width="2" opacity="0.28" />
      <path d="M32 204 C126 204 120 235 198 235 C285 235 281 149 370 149" fill="none" stroke="#F4EDDE" stroke-width="2" opacity="0.28" />

      <circle cx="32" cy="102" r="8" fill="#FF6B5F" />
      <circle cx="32" cy="204" r="8" fill="#FFB347" />
      <circle cx="198" cy="71" r="8" fill="#D8FF3D" />
      <circle cx="198" cy="235" r="8" fill="#D8FF3D" />

      <circle cx="370" cy="149" r="92" fill="#151410" stroke="#F4EDDE" stroke-width="2" />
      <circle cx="370" cy="149" r="62" fill="none" stroke="#D8FF3D" stroke-width="2" opacity="0.72" />
      <circle cx="370" cy="149" r="31" fill="#D8FF3D" />
      <path d="M356 149 L366 159 L386 137" fill="none" stroke="#0F0E0C" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" />

      <text x="3" y="83" fill="#A9A294" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.5">EVIDENCE</text>
      <text x="3" y="235" fill="#A9A294" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.5">CONSTRAINTS</text>
      <text x="161" y="45" fill="#A9A294" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.5">MODEL</text>
      <text x="155" y="268" fill="#A9A294" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="1.5">TESTS</text>
      <text x="320" y="273" fill="#F4EDDE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ACTION</text>
